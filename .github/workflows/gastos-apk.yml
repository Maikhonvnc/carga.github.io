name: Gerar APK - Meus Gastos
on:
  push:
    paths: ['gastos/**', '.github/workflows/gastos-apk.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - name: Montar e assinar APK
        run: |
          set -e
          curl -sLo apktool.jar https://github.com/iBotPeaches/Apktool/releases/download/v2.10.0/apktool_2.10.0.jar
          mkdir -p gastos/android/assets
          cp gastos/index.html gastos/manifest.json gastos/icon.svg gastos/android/assets/
          java -jar apktool.jar b gastos/android -o unsigned.apk
          BT=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)
          $BT/zipalign -f 4 unsigned.apk aligned.apk
          keytool -genkeypair -keystore k.jks -storepass gastos123 -keypass gastos123 -alias gastos \
            -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Meus Gastos"
          $BT/apksigner sign --ks k.jks --ks-pass pass:gastos123 --out MeusGastos.apk aligned.apk
          $BT/apksigner verify MeusGastos.apk
      - uses: actions/upload-artifact@v4
        with: { name: MeusGastos-apk, path: MeusGastos.apk }
      - name: Publicar release
        env: { GH_TOKEN: '${{ github.token }}' }
        run: |
          gh release delete gastos-apk -y --cleanup-tag || true
          gh release create gastos-apk MeusGastos.apk --target "$GITHUB_SHA" -t "Meus Gastos (APK)" -n "Baixe o MeusGastos.apk abaixo e instale no Android."
